# About Section
# about_title: About Me
about_profile_image: images/profile.jpg
about_content: |
  ## Introduction
  I am a software engineer with 15+ years of experience building business critical production systems.  
  
  My focus has been mainly on <mark>backend</mark> systems based on the <mark>JVM</mark>. I am
  most proficient in the <mark>Scala</mark> language but I am no stranger to <mark>Java</mark>. When needed
  I can also be of help in <mark>frontend</mark> development where I most familiar with the <mark>TypeScript</mark> and <mark>React</mark> combination.
  
  Most systems I have worked on have been distributed in nature so I am
  very familiar with challenges in this domain. My experience includes:
  
  - Managing distributed systems using <mark>Kubernetes</mark> or <mark>Nomad</mark>
  - Cloud platforms to host these systems, in order of most familiarity: <mark>Azure</mark>, <mark>AWS</mark>, <mark>GCE</mark>
  - Building automated pipelines for <mark>Continuous delivery</mark> on various platforms such as <mark>Azure</mark> pipelines, <mark>Github Actions</mark> and <mark>Jenkins</mark>
  - Using techniques such as <mark>CQRS</mark>, sharding and caching to scale systems to handle large traffic volumes.
  - Storing data in databases: <mark>Postgres</mark>, <mark>MySQL</mark> and <mark>Cassandra</mark> as well as search engines, mainly <mark>Elastic Search</mark> but also <mark>Solr</mark>
  - Message bus systems such as <mark>Kafka</mark> and queue systems such as <mark>RabbitMq</mark>
  
  As well as more technical aspects such as

  - <mark>CAP</mark> theorem and its implications in practice
  - Distributed state and it's challenges, such as preventing split brain
  - Dealing with systems that maintain their own cluster state (<mark>Akka</mark>)
  - Different consistency models: <mark>ACID</mark> vs eventual consistency models such as <mark>CRDT</mark>s
  - Event sourcing
  
  Additionally, the principle "you build it you own it" has always applied for the code that I have written. Meaning I have always been responsible to maintain and operate systems as well. This comes with additional challenges
  
  - Gaining insights into systems and being able to debug them through <mark>observability</mark> stacks (<mark>logs</mark>, <mark>metrics</mark>, <mark>traces</mark>). Most notably ELK and <mark>Datadog</mark>
  - Responding to issues reported by automated monitors (preferably) or customers
  - Being "on call" for 24/7 stand by using <mark>PagerDuty<mark>
  
  ## Tech profile
  ### Tier 1 (Daily driver)
  
  <mark>Scala</mark>, <mark>git</mark> & <mark>Github</mark>, <mark>Intellij IDEA</mark>, <mark>Linux</mark>, <mark>MacOS</mark>, <mark>Docker</mark>, 
  <mark>terminal</mark>, <mark>bash</mark> & <mark>zsh</mark>, <mark>ssh</mark>, <mark>Kubernetes</mark>, <mark>Kafka</mark>, <mark>Elastic Search</mark>, <mark>Postgres</mark>
  
  ### Tier 2 (Proficient)
  
  <mark>Java</mark>, <mark>Typescript</mark>, <mark>React</mark>, <mark>helm</mark>, <mark>nginx</mark>

# Footer
footer_show_references: true

