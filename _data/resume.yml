  - title: Work Experience
    layout: list
    content:

      - layout: left
        title: DHL
        link: dhl.com
        logo: images/dhl-logo.png
        sub_title: Senior Backend Software Engineer (Freelance)
        caption: January 2023 - Present

        description: |
          ## Backend Developer at Team B2X
          
          ### Team Responsibilities:
            - Management of the primary service for label/parcel intake, > 1 million parcels per day. Including 24/7 on-call duty
            - Management of My DHL Parcel (MDP) portal for business customers
          
          ### Tech stack
          Most of the backend is written in <mark>Scala</mark> using various frameworks such as <mark>akka</mark>, <mark>Play</mark> and <mark>tapir</mark>. A small percentage is using <mark>PHP</mark>.
          Services deployed on <mark>Kubernetes</mark> hosted on <mark>Azure</mark>, deployed using <mark>Helm</mark> with Azure pipelines.
          
          The frontend stack is <mark>Typescript</mark> with <mark>React</mark>. Assets hosted by <mark>Cloudflare</mark> workers.
          
          Other components and technologies used:
          <mark>Elastic Search</mark>, <mark>Kafka</mark>, <mark>Postgres</mark>
          
          ### Way of working
          Local flavour of Scrum/kanban with sprints of 3 weeks. Retro's, refinements. PR reviews.
          
          ## Projects
          
          ### Numerous migration projects, the largest of which were:
            - All services (30+) migrated from <mark>MesOS</mark> to <mark>Kubernetes</mark>. Long project (> 6 months)
            - <mark>Kafka</mark> on-premise migrated to Confluent Cloud
            - Approximately 10 <mark>Postgres</mark> databases migrated to Azure Postgres Flexible Server
          
          ### Notable features developed
            - Matrix barcodes on labels for improved scannability
            - Account managers feature in MDP
            - Upgrade the Direct Print Desktop application to support OS native printer drivers
            - Integrating the support system with an <mark>AI</mark> chatbot
          
          ### Technical improvements:
            - Contract-first approach for communication using <mark>OpenAPI</mark> specs (for FE) and <mark>gRPC</mark> (BE)
            - <mark>Observability</mark>, improved monitoring & alerting on critical systems and data flows

      - layout: left
        title: Marktplaats
        link: marktplaats.nl
        logo: images/marktplaats-logo.png
        sub_title: Senior Backend Software Engineer (Freelance)
        caption: November 2020 - December 2022
        description: |
          ## Overview
          
          I joined Marktplaats during a time of reorganization. The reason for this was that the company was sold off to Adevinta by Ebay classifieds group.
          I experienced both the end of eBay and the start of Adevinta. Because of these hectic times I was part of 3 different teams (see below).
          
          **General way of working in all teams**
          
          Local flavor of scrum/kanban, ticket system using epics & stories, agile, dev-ops with on-call, git-flow using feature branches, PR reviews
          
          **Common tech stack of the platform**
          
          - *Backend services* : Mostly JVM using <mark>Scala</mark> with some parts still in <mark>Java</mark>.
          - *Persistence*: A mix of <mark>MySQL</mark>, <mark>Cassandra</mark>, <mark>CockroachDB</mark> and <mark>ElasticSearch</mark> for search.
          - *Communication protocols*: <mark>Thrift</mark> for internal, <mark>HTTP</mark> for external, <mark>Kafka</mark> for async message delivery, RabbitMq for traditional queue requirements
          - *Frontend*: TypeScript / React with some parts still in vanilla Javascript
          - *Deployment pipeline*: Jenkins for building and Nomad (on private cloud) for deployment with some homegrown tooling around it.
          - *Developer tooling*: GitHub Enterprise, Jira, mix of maven & sbt, docker

          <br />
          ## Trust, safety & support team
          *November 2021 – December 2022*
          
          This team was responsible for maintaining services related to identity
          (login, account creation, 2FA, etc…) as well as customer support tooling.
          
          **My role**
          
          Senior developer contributing to mostly the backend but also frontend.
          Main contributions:
          - A new customer support tool written in a modern tech stack (<mark>TypeScript/React</mark> frontend and <mark>Scala</mark> on backend) to replace an
            old legacy application still running as .war on bare metal on a servlet container.
          - Various anti-fraud measures on the backend.
          
          <br />
          ## Platform modernisation team
          *May 2021 – November 2021*
          
          This team’s purpose was to ‘modernize’ the backend platform. It was later
          disbanded because of reorganization.
          
          **My role**
          
          Senior backend developer
          
          **Main contributions**
          
          - Helping to finish up a database migration project (switching from <mark>MySQ</mark> to <mark>Cassandra</mark>)
          - Implement cleanup of dormant (unused) accounts as part of GDPR. This means that accounts inactive for a long period will be deleted.
          
          <br />
          ## Platform project team
          *December 2020 – May 2021*
          
          This team’s purpose was to pick up big projects to improve the platform. It
          was later disbanded because of reorganization.
          
          **My role**
          Senior backend developer
          
          **Main contributions**
          - Helping on the backend side to finish up a big rewrite of part of the frontend.
          - Mapping out a potential big migration project regarding identity (login, 2FA, account creation, etc…)

      - layout: left
        title: Sabbatical
        logo: images/sabbatical.jpg
        caption: May 2019 - November 2020
        description: |

          After 10 years of working in IT I felt the urge to take a break for a while. I
          did take some time in the beginning to familiarize myself with Kubernetes
          which had caught my attention during my last project.
          Beyond that I traveled around a lot and basically let go of the idea of work
          for a while. A sabbatical is a very fortunate thing that not many people
          have the opportunity to experience. I am grateful to have had this time for
          myself.

      - layout: left
        title: Trivento
        link: trivento.nl
        logo: images/trivento.png
        caption: December 2014 - May 2019
        description: |
          ## Consultancy at Trivento
          I applied at Trivento with a wish to apply the <mark>Scala</mark> programming
          language which, at that point, I was not very experienced with. They
          successfully found me projects at Wehkamp and ING (see below).
          I had a very good time here and learned a lot but after almost 5 years I decided 
          to take a break and go freelance.

      - layout: left
        title: ING
        link: ing.nl
        logo: images/ing-trivento.png
        caption: June 2015 - December 2018
        description: |
          ## Mobile Onboarding
          *April 2016 – December 2018*
          
          After two POCs we were given the opportunity to develop the backend for the Mobile Onboarding project. This project would allow customers to onboard and open a bank account at ING themselves using only their mobile phone. 
          
          <https://www.ing.nl/particulier/betalen/bankrekeningen/mobiel-rekeningopenen/index.html>
          
          I was involved in this project from start to finish. During this time the Baker process orchestration library was developed to
          cope with the complex and often changing business process. It was open sourced after some time at:
          
          <https://www.github.com/ing-bank/baker>
          
          This library is built in <mark>Scala</mark> using <mark>Akka</mark> (including clustering, persistence &
          sharding). Petri nets were chosen for the underlying execution semantics because of
          its simplicity, mathematical foundation and personal experience with the
          concept.
          
          **My role**
          
          My main focus was the design and development of the Baker library
          although I also contributed to the Mobile onboarding project which the library served.
          
          **Way of working**
          
          Small team (3 developers), Kanban, agile, dev-ops, PRs & code reviews
          
          **Tools used:**
          <mark>Docker</mark>, <mark>Git</mark>, <mark>Gitlab</mark>, <mark>Maven</mark>, <mark>Sbt</mark>
          <mark>akka</mark>, <mark>cats</mark>, <mark>fs2</mark>, <mark>scalacheck</mark>
          <mark>Kafka</mark>, <mark>cassandra</mark>, <mark>jenkins</mark>
          
          <br />
          
          ## Scala POC 2
          *Oktober 2015 - March 2016*
          
          Re-building a critical service with high scalability and resilience requirements using the <mark>Scala</mark> and <mark>Akka</mark> stack.
          
          <br />
          
          ## Scala POC 1
          *June 2015 - September 2015*
          
          A POC using <mark>Scala</mark> and <mark>Akka</mark> to prove the technology is mature and
          satisfies all requirements to deploy in production at the ING bank.

      - layout: left
        title: Wehkamp
        link: wehkamp.nl
        logo: images/trivento-wehkamp.png
        caption: January 2015 - June 2015
        description: |
          ## Blaze
          *January 2015 – June 2015*
          
          A new platform developed from the ground up for Wehkamp BE.
          Envisioned to later replace the .NET based architecture of Wehkamp NL.
          Based around a micro service architecture and hosted on <mark>AWS</mark> following the principles from the reactive manifesto:
          responsive, resilient, message driven & elastic.
          
          **My role**
          
          Developer in a feature team. Responsible, as a team, for the design/
          development/testing/deployment & maintenance of a few micro services.
          The main focus was on the <mark>Scala</mark> backend but features sometimes also
          touched on the frontend which was written in <mark>AngularJS</mark>.
          
          **Way of working**
          SCRUM, agile, dev-ops, Gitflow (PRs & code reviews)
          
          **Applied methods**
          - Micro service architecture
          - Actor systems using <mark>Akka</mark>
          - Functional programming, event sourcing & <mark>CQRS</mark>
          - REST APIs
          - Private cloud deployment on <mark>Mesos</mark> / <mark>Marathon</mark>
          
          **Tools used**
          Git, Github, Scala, sbt, Javascript
          akka, spray, scalaz, AngularJS (1.x)
          Bamboo, ansible, docker, mesos / marathon, amazon AWS

      - layout: left
        title: Stream
        link: streamconsulting.nl
        logo: images/stream.png
        caption: July 2009 - September 2014
        description: |
          ## Statebox
          *September 2009 - September 2014*
          
          Long running project that was the core of a SAAS solution by Stream B.V.
          of which Econosto and Dienst Justitiële Inrichtingen (DJI) at that time were the most
          important clients.
          
          This product involved a low latency process engine based on
          petri nets which was tightly coupled with <mark>Drupal</mark>, which hosted all
          the business data of the process cases. A backend service in <mark>Java</mark> managed
          the process flow and a frontend written in <mark>GWT</mark> (java compiled to
          javascript) could be used to investigate process cases and their state and
          act on them.
          
          **My role**
          First co-developer, then project lead (from 2011), small team 2-3 devs.
          
          Way of working
          Loose kanban style.
          
          **Most important contributions**
          - A petri net extension system (arc-inhibitors, type restrictions)
          - A Test platform with DSL
          - A Scheduler/execution engine
          - An immutable/persistent collection library for Java

